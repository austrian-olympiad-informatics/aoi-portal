# Shared config for every CMS service: same image, TOML config mounted at
# /config/cms.toml and pointed to via CMS_CONFIG.
x-cms-common: &cms-common
  build:
    context: ../cms
  environment:
    CMS_CONFIG: /config/cms.toml
  volumes:
    - "./docker/cms.docker.toml:/config/cms.toml:ro"
  networks:
    - cms

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app:rw
    networks:
      - proxy

  db:
    image: postgres:15
    volumes:
      - ./data/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./docker/config.yaml:/config.yaml:ro
    networks:
      - backend
      - proxy
      - cms

  console:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bash -c 'pip3 install -e . && tail -f /dev/null'
    volumes:
      - ./backend:/app
      - ./docker/config.yaml:/config.yaml:ro
    networks:
      - cms
      - backend
  
  nginx:
    image: nginx:latest
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy

  cmsdb:
    image: postgres:15
    volumes:
      - ./data/cmsdb:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_PASSWORD: cms
      POSTGRES_USER: cmsuser
      POSTGRES_DB: cmsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmsuser -d cmsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cms

  # One-shot: create the CMS schema, then exit. cmsInitDB isn't idempotent
  # (it CREATE DOMAINs), so tolerate an already-initialized DB and exit 0 so
  # dependent services can start.
  cms-initdb:
    <<: *cms-common
    command: ["bash", "-lc", "cmsInitDB || echo 'cmsInitDB returned nonzero, schema already present; continuing'"]
    depends_on:
      cmsdb:
        condition: service_healthy
    restart: "no"

  cms-console:
    <<: *cms-common
    command: tail -f /dev/null
    depends_on:
      cms-initdb:
        condition: service_completed_successfully

  cms-admin-web-server:
    <<: *cms-common
    command: cmsAdminWebServer 0
    depends_on:
      cms-initdb:
        condition: service_completed_successfully
    ports:
      - 8889:8889

  cms-evaluation-service:
    <<: *cms-common
    command: cmsEvaluationService -c ALL 0
    depends_on:
      cms-initdb:
        condition: service_completed_successfully

  cms-scoring-service:
    <<: *cms-common
    command: cmsScoringService -c ALL 0
    depends_on:
      cms-initdb:
        condition: service_completed_successfully

  cms-worker-0:
    <<: *cms-common
    command: cmsWorker 0
    depends_on:
      cms-initdb:
        condition: service_completed_successfully
    volumes:
      - "./docker/cms.docker.toml:/config/cms.toml:ro"
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"

networks:
  backend:
  cms:
  proxy:
