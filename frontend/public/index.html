<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16x16.png">
    <link rel="mask-icon" href="<%= BASE_URL %>safari-pinned-tab.svg" color="#8a151b">
    <link rel="preload" as="font" href="<%= require('@/assets/fonts/arimo-v27-latin-regular.woff2') %>" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" as="font" href="<%= require('@/assets/fonts/arimo-v27-latin-600.woff2') %>" type="font/woff2" crossorigin="anonymous">
    <link rel="prefetch" as="font" href="<%= require('@/assets/fonts/fira-code-v21-latin-regular.woff2') %>" type="font/woff2" crossorigin="anonymous">
    <meta name="theme-color" content="#ffffff">
    <title>Österreichische Informatikolympiade</title>
    <script>
      // Apply the persisted theme before the bundle loads to avoid a flash
      // of the wrong theme. Mirrors src/util/theme.ts.
      (function () {
        var mode = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("aoiState") || "{}");
          if (saved.themeMode) mode = saved.themeMode;
        } catch (e) { /* fall back to system */ }
        var resolved = mode === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Informatikolympiade doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
